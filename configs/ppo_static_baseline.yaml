# RL-Games PPO configuration for the static navigation baseline.
# Batch per update = num_actors (64) x horizon_length (128) = 8192 transitions
#   -> 2 minibatches of 4096, 4 epochs -> 8 gradient steps per iteration.
params:
  seed: 42

  env:
    clip_observations: .inf   # no observation clipping (RL-Games still clamps normalised obs to +-5)
    clip_actions: 1.0         # policy samples are clamped to [-1, 1]; the env rescales to physical units

  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    separate: False           # actor and critic share the MLP trunk
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0              # log-std starts at 0 -> std = 1
        fixed_sigma: True     # state-independent, learned log-std
    mlp:
      units: [256, 128, 64]
      activation: elu
      d2rl: False
      initializer:
        name: default
      regularizer:
        name: None

  load_checkpoint: False
  load_path: ''

  config:
    name: static_baseline
    full_experiment_name: static_baseline
    env_name: rlgpu
    device: cuda:0
    device_name: cuda:0
    multi_gpu: False
    ppo: True
    mixed_precision: False
    normalize_input: True
    normalize_value: True
    value_bootstrap: False
    num_actors: 64
    reward_shaper:
      scale_value: 0.1        # rewards are multiplied by 0.1 for learning only; logged returns are unscaled
    normalize_advantage: True
    gamma: 0.99
    tau: 0.95
    learning_rate: 3.0e-4
    lr_schedule: adaptive
    kl_threshold: 0.008
    score_to_win: 20000
    max_epochs: 200
    save_best_after: 50
    save_frequency: 25
    grad_norm: 1.0
    entropy_coef: 0.0
    truncate_grads: True
    e_clip: 0.2
    horizon_length: 128
    minibatch_size: 4096
    mini_epochs: 4
    critic_coef: 2
    clip_value: True
    seq_length: 4
    bounds_loss_coef: 0.0001

    player:
      deterministic: True
      games_num: 100
